<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Big Festive Days Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sale masthead with a 39-day strip, then a tabbed working area (day, category, SKU, sources) built around one wide data table per view. */
:root {
  --paper: #F5F6F8; --card: #FFFFFF; --ink: #16181D; --muted: #5B6270; --line: #E1E4EA; --soft: #EEF0F4;
  --web: #CF7300; --app: #0B7580; --other: #9AA1AD; --flash: #B8236F;
  --good: #1D8049; --bad: #BF3B26; --warn: #A86A00;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #101217; --card: #171A20; --ink: #ECEEF2; --muted: #9AA1AD; --line: #2A2E37; --soft: #1E222A;
  --web: #F09A2A; --app: #33B7C2; --other: #6B7280; --flash: #E25C9F;
  --good: #4CC27D; --bad: #F07A63; --warn: #E3AE4A; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #101217; --card: #171A20; --ink: #ECEEF2; --muted: #9AA1AD; --line: #2A2E37; --soft: #1E222A;
  --web: #F09A2A; --app: #33B7C2; --other: #6B7280; --flash: #E25C9F;
  --good: #4CC27D; --bad: #F07A63; --warn: #E3AE4A; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font: 14px/1.5 var(--f-body); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em }
h1 { font-size: clamp(26px, 4vw, 38px); line-height: 1.05 }
h2 { font-size: 18px }
h3 { font-size: 15px }
.num, td.n, th.n { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 12.5px }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
button, select, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--app); outline-offset: 2px }

/* masthead */
.mast { display: grid; gap: 14px }
.mast-top { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between }
.mast-title { display: grid; gap: 4px; min-width: 0 }
.offers { display: flex; flex-wrap: wrap; gap: 6px }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-size: 12px; white-space: nowrap }
.chip .dot { width: 8px; height: 8px; border-radius: 50% }
.countdown { font-family: var(--f-display); font-size: 20px; font-weight: 700 }
.strip { display: grid; grid-template-columns: repeat(39, minmax(0, 1fr)); gap: 2px; }
.strip button { height: 30px; border: 0; padding: 0; border-radius: 3px; background: var(--soft); position: relative }
.strip button.has { background: color-mix(in srgb, var(--web) 28%, var(--soft)) }
.strip button.flash { box-shadow: inset 0 -4px 0 var(--flash) }
.strip button.today { outline: 2px solid var(--ink); outline-offset: 1px }
.strip button.sel { background: var(--web) }
.strip-legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted); justify-content: space-between }

/* controls */
.bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden }
.seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 13px }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper) }
.seg button:disabled { opacity: .4; cursor: not-allowed }
.bar label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted) }
.bar input[type=date], .bar select, .bar input[type=search] { background: var(--paper); border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; font-size: 13px; max-width: 100% }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 7px; padding: 5px 11px; font-size: 13px }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink) }
.spacer { flex: 1 1 auto }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs button { border: 0; background: none; padding: 9px 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--web) }

/* sources line */
.sources { display: flex; flex-wrap: wrap; gap: 6px }
.src { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; padding: 3px 9px; border-radius: 6px; background: var(--card); border: 1px solid var(--line) }
.src i { width: 7px; height: 7px; border-radius: 50%; background: var(--other) }
.src.ok i { background: var(--good) } .src.load i { background: var(--warn) } .src.err i { background: var(--bad) }
.src.err { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)) }

/* kpis */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; min-width: 0 }
.kpi .v { font-family: var(--f-mono); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.kpi .d { font-size: 12px }
.up { color: var(--good) } .down { color: var(--bad) }

.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; min-width: 0 }
.panel-head { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; justify-content: space-between }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px }

/* tables */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap }
th { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--soft); position: sticky; top: 0 }
th.n, td.n { text-align: right }
th.sortable { cursor: pointer }
tbody tr:hover td { background: color-mix(in srgb, var(--web) 6%, transparent) }
tr.pick td { cursor: pointer }
tr.sel td { background: color-mix(in srgb, var(--app) 12%, transparent) }
tfoot td { font-weight: 600; background: var(--soft) }
tfoot tr.base td { font-weight: 500; color: var(--muted) }
td.title { max-width: 360px; overflow: hidden; text-overflow: ellipsis }
td.na { color: var(--muted) }
.pill { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px }
.pill.flash { background: color-mix(in srgb, var(--flash) 18%, transparent); color: var(--flash) }
.pill.payday { background: color-mix(in srgb, var(--app) 16%, transparent); color: var(--app) }
.pill.pre { background: var(--soft); color: var(--muted) }
.pill.part { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn) }
.heat td.n { color: var(--ink) }
.heat th:first-child, .heat td:first-child { position: sticky; left: 0; background: var(--card); z-index: 1 }
.heat th:first-child { background: var(--soft); z-index: 2 }
.heat td.tot, .heat th.tot { border-left: 2px solid var(--line); font-weight: 600 }

/* summary tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 8px; display: grid; gap: 2px; min-width: 0 }
.tile .v { font-family: var(--f-mono); font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile .d { font-size: 12px; color: var(--muted) }
.tile svg { width: 100%; height: 34px; display: block; margin-top: 4px }
.bar-cell { position: relative }
.bar-cell i { position: absolute; left: 0; top: 4px; bottom: 4px; background: color-mix(in srgb, var(--web) 18%, transparent); border-radius: 2px; z-index: 0 }
.bar-cell span { position: relative; z-index: 1 }
.dchip { display: inline-block; min-width: 54px; text-align: right; padding: 1px 6px; border-radius: 5px; font-family: var(--f-mono); font-size: 12px }
.dchip.up { background: color-mix(in srgb, var(--good) 14%, transparent) }
.dchip.down { background: color-mix(in srgb, var(--bad) 13%, transparent) }
.dchip.flat { color: var(--muted) }
.cmp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px }
.cmp-card { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--card) }
.cmp-card .row { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px }
.stack { display: grid; gap: 14px }
.tile.proj { border-color: color-mix(in srgb, var(--web) 45%, var(--line)); background: color-mix(in srgb, var(--web) 5%, var(--card)) }
.tile.proj .v { font-size: 26px }
.tile.d0 { gap: 4px }
.tile.d0 .v { font-size: 28px }
.cmprow { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 4px }
.cmpc { display: inline-flex; align-items: center; gap: 4px; font-size: 12px }

.chart svg { display: block; width: 100%; height: auto }
.chart text { fill: var(--muted); font: 11px var(--f-mono) }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend b { width: 10px; height: 10px; border-radius: 2px; display: inline-block }

.note { font-size: 12.5px; color: var(--muted); max-width: 90ch }
.note b { color: var(--ink); font-weight: 600 }
.alert { border: 1px solid color-mix(in srgb, var(--bad) 40%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--card)); border-radius: 10px; padding: 10px 12px; font-size: 13px }
.empty { padding: 28px 12px; text-align: center; color: var(--muted) }
dl.defs { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 13px }
dl.defs dt { font-weight: 600 }
dl.defs dd { margin: 0; color: var(--muted) }
@media (max-width: 560px) { dl.defs { grid-template-columns: minmax(0, 1fr) } .strip button { height: 22px } }
@media (prefers-reduced-motion: no-preference) { .strip button, .seg button, .tabs button { transition: background .15s } }
</style>

<div class="wrap">
  <header class="mast">
    <div class="mast-top">
      <div class="mast-title">
        <span class="eyebrow">R for Rabbit · D2C web + app</span>
        <h1>Big Festive Days</h1>
        <span class="muted">Lowest Price of the Year · 1 Oct to 8 Nov 2026 · 39 sale days</span>
      </div>
      <div style="display:grid;gap:6px;justify-items:end">
        <span class="countdown" id="countdown"></span>
        <div class="offers">
          <span class="chip"><span class="dot" style="background:var(--web)"></span>Web 10% sitewide</span>
          <span class="chip"><span class="dot" style="background:var(--app)"></span>App 12% sitewide</span>
          <span class="chip"><span class="dot" style="background:var(--flash)"></span>Flash: web 12% / app 15% + free gift</span>
        </div>
      </div>
    </div>
    <div class="strip" id="strip" aria-label="Sale days, click one to view that day"></div>
    <div class="strip-legend"><span>1 Oct</span><span>Flash Sale 1 · 7-8 Oct</span><span>Flash Sale 2 · 17-18 Oct</span><span>Payday week · 28 Oct-7 Nov</span><span>8 Nov</span></div>
  </header>

  <div class="bar" id="bar">
    <div class="seg" id="presets" role="group" aria-label="Date range">
      <button data-p="sale">Whole sale</button>
      <button data-p="f1">Flash 1</button>
      <button data-p="f2">Flash 2</button>
      <button data-p="pay">Payday wk</button>
      <button data-p="base">Pre-sale 14d</button>
      <button data-p="l7">Last 7d</button>
    </div>
    <label for="from">From <input type="date" id="from"></label>
    <label for="to">To <input type="date" id="to"></label>
    <label for="catSel">Category <select id="catSel"><option value="">All categories</option></select></label>
    <span class="spacer"></span>
    <div class="seg" id="plat" role="group" aria-label="Platform">
      <button data-v="total">Total</button><button data-v="web">Web</button><button data-v="app">App</button>
    </div>
    <div class="seg" id="srcSeg" role="group" aria-label="Funnel source">
      <button data-v="live" title="Web funnel from Shopify sessions, app funnel from Linkrunner">Shopify + Linkrunner</button>
      <button data-v="ga4" title="Funnel from imported GA4 exports">GA4</button>
    </div>
    <button class="btn primary" id="refresh">Refresh data</button>
    <button class="btn" id="xlsx" hidden>Download Excel</button>
    <span class="small muted" id="xlsxMsg" role="status"></span>
  </div>

  <div class="sources" id="sources"></div>
  <div id="pageAlert" hidden></div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-t="d0">D0 (today)</button>
    <button role="tab" data-t="sum">Summary</button>
    <button role="tab" data-t="cmp">Comparison</button>
    <button role="tab" data-t="day">Funnel</button>
    <button role="tab" data-t="cat">Category</button>
    <button role="tab" data-t="sku">SKU</button>
    <button role="tab" data-t="ret">Returns and cancellations</button>
    <button role="tab" data-t="src">Sources and GA4</button>
  </nav>

  <main id="main"></main>
</div>

<script>
(() => {
'use strict';
const CATS = ["Baby Gear", "Baby and Kids Care", "Clothing", "Diapering", "Feeding Nursing and Nursery", "Furniture", "Gift Cards", "Ride ons and Toys", "Unmapped"];
const SKUMAP = {};   // store data not included in this copy; set categories under Categories (tools/catalog.cjs)
const HMAP = {"p":{},"c":{}};   // store data not included in this copy; set categories under Categories (tools/catalog.cjs)
const DATA_V = 4;                                // bump when the saved day shape changes
/* Parenting tools (the /pages/parenting-tools hub and the 18 tools it links to) are left out of every sessions figure:
   they draw 17-19% of web sessions but almost no carts or orders. Shopify only knows a session's landing page,
   so the rule is: sessions that LANDED on one of these pages are excluded. */
const TOOL_PAGES = ['/pages/parenting-tools', '/pages/parenting-gpt', '/pages/astrology-birth-chart-calculator', '/pages/baby-name-generator', '/pages/numerology-calculator', '/pages/chinese-gender-predictor', '/pages/nakshatra-calculator', '/pages/online-pregnancy-test', '/pages/pregnancy-due-date-calculator', '/pages/immunization-scheduler-and-chart', '/pages/period-calculator', '/pages/contraction-calculator', '/pages/c-section-checklist', '/pages/diaper-bag-checklist', '/pages/child-blood-type-calculator', '/pages/breast-milk-calculator', '/pages/baby-cost-calculator', '/pages/child-growth-percentile-calculator', '/pages/baby-eye-color-calculator'];
const NO_TOOLS = `landing_page_path NOT IN (${TOOL_PAGES.map(p => `'${p}'`).join(', ')})`;
const OTHER_PAGES = 'Home, search and other pages', MIXED = 'Multi-category collections', UNMAPPED_PAGES = 'Unmapped product pages';
const SALE = { start: '2026-10-01', end: '2026-11-08' };
const BASE = { start: '2026-09-17', end: '2026-09-30' };
const FLASH = ['2026-10-07', '2026-10-08', '2026-10-17', '2026-10-18'];
const PAYDAY = { start: '2026-10-28', end: '2026-11-07' };
const SHOP = 'Shopify', LR = 'Linkrunner';
const NO_SKU = 'No SKU (adjustments)', NOT_MAPPED = 'Not in catalogue map';

/* ---------- dates ---------- */
const today = new Date(Date.now() + 19800000).toISOString().slice(0, 10); // IST
const addD = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const days = (a, b) => { const out = []; for (let d = a; d <= b; d = addD(d, 1)) out.push(d); return out; };
const yesterday = addD(today, -1);
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fd = s => { const d = new Date(s + 'T00:00:00Z'); return d.getUTCDate() + ' ' + MON[d.getUTCMonth()]; };
const fdw = s => DOW[new Date(s + 'T00:00:00Z').getUTCDay()] + ' ' + fd(s);
const clampToday = s => (s > today ? today : s);
const saleDay = s => Math.round((Date.parse(s) - Date.parse(SALE.start)) / 864e5) + 1;
function phase(d) {
  if (FLASH.includes(d)) return d < '2026-10-10' ? ['flash', 'Flash 1'] : ['flash', 'Flash 2'];
  if (d >= PAYDAY.start && d <= PAYDAY.end) return ['payday', 'Payday wk'];
  if (d < SALE.start) return ['pre', 'Pre-sale'];
  if (d > SALE.end) return ['pre', 'Post-sale'];
  return null;
}

/* ---------- format ---------- */
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fin = v => typeof v === 'number' && isFinite(v);
const fN = v => fin(v) ? Math.round(v).toLocaleString('en-IN') : '–';
const fR = v => {
  if (!fin(v)) return '–';
  const a = Math.abs(v);
  if (a >= 1e7) return '₹' + (v / 1e7).toFixed(2) + ' cr';
  if (a >= 1e5) return '₹' + (v / 1e5).toFixed(2) + ' L';
  return '₹' + Math.round(v).toLocaleString('en-IN');
};
const fP = (v, dp = 2) => fin(v) ? (v * 100).toFixed(dp) + '%' : '–';
const div = (a, b) => (fin(a) && fin(b) && b > 0 ? a / b : NaN);
const delta = (v, b) => {
  if (!fin(v) || !fin(b) || b === 0) return '<span class="muted">–</span>';
  const p = v / b - 1;
  return `<span class="${p >= 0 ? 'up' : 'down'}">${p >= 0 ? '+' : ''}${(p * 100).toFixed(0)}%</span>`;
};

/* ---------- state ---------- */
const S = {
  from: null, to: null, plat: 'total', src: 'live', tab: 'd0', cat: '', anchor: null,
  days: {}, skus: {}, ga4: {},
  selCat: null, selSku: null, skuQ: '', skuCat: '', skuSort: 'net',
  status: {
    [SHOP]: { st: 'idle', msg: 'Waiting' },
    [LR]: { st: 'idle', msg: 'Waiting' },
    db: { st: 'idle', msg: 'Waiting' },
  },
  mcp: null, db: null, canWrite: null, busy: false,
};
try { const t = localStorage.getItem('bfd.tab2'); if (t) S.tab = t; } catch (e) {}
if (/^#(d0|sum|cmp|day|cat|sku|src)$/.test(location.hash)) S.tab = location.hash.slice(1);
if (!['d0', 'sum', 'cmp', 'day', 'cat', 'sku', 'ret', 'src'].includes(S.tab)) S.tab = 'd0';

function preset(p) {
  const clip = (a, b) => [a, b > today ? (today >= a ? today : b) : b];
  if (p === 'sale') return clip(SALE.start, SALE.end);
  if (p === 'f1') return ['2026-10-07', '2026-10-08'];
  if (p === 'f2') return ['2026-10-17', '2026-10-18'];
  if (p === 'pay') return clip(PAYDAY.start, PAYDAY.end);
  if (p === 'base') return clip(BASE.start, BASE.end);
  if (p === 'l7') return [addD(today, -6), today];
}
[S.from, S.to] = today >= SALE.start ? preset('sale') : preset('base');

/* ---------- data shaping ---------- */
const chKey = c => c === 'Online Store' ? 'w' : c === 'Appmaker.xyz - Mobile app' ? 'a' : c === 'Draft Orders' ? 'd' : 'o';
function rowsOf(payload) {
  let p = payload;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return []; } }
  if (p && !p.rows && p.data) p = p.data;
  if (!p || !Array.isArray(p.rows) || !Array.isArray(p.columns)) throw { code: 'shape', message: 'Unexpected response shape from the connector.' };
  const cols = p.columns.map(c => c.name);
  return p.rows.map(r => Object.fromEntries(cols.map((c, i) => [c, r[i]])));
}
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const catOf = sku => !sku ? NO_SKU : (SKUMAP[sku] !== undefined ? CATS[SKUMAP[sku]] : NOT_MAPPED);

/* day metrics for a platform and source */
function dayMetrics(d, plat, src) {
  const D = S.days[d];
  const g = S.ga4[d];
  const m = { users: NaN, sessions: NaN, atc: NaN, checkout: NaN, orders: NaN, aovW: NaN, aovA: NaN, net: NaN, proxy: false };
  if (D && D.shop) {
    const sh = D.shop;
    const w = sh.w || {}, a = sh.a || {}, o = sh.o || {};

/* whole-store D0 view: so far, same time on D-1 / D-7 / last month, projected full day, month end */
function d0View() {

  const dr = (d, k) => { const x = DF[k] && S.days[d] && S.days[d].shop && S.days[d].shop.d; return x && fin(x[DF[k]]) ? x[DF[k]] : 0; };
  const fS = share(K.s);
  const appSf = app(today), appProj = fin(appSf) && fS > 0.05 ? Math.max(appSf, appSf / fS) : NaN;
  const row = (key, label, fmt, k, inv) => ({ key, label, fmt, inv: !!inv, sfX: soFar(k), projX: proj(k), draft: dr(today, k), sf: soFar(k) + dr(today, k), proj: proj(k) + dr(today, k),

/* projections for every category and SKU (and the store on a platform filter), from SKU order lines */
function projAll() {
  const P = S.proj, M = projModel(); const tdy = S.skus[today];
  if (!M || !tdy) return null;
  const ch = CHANS(), at = tdy.fetchedAt || P.fetchedAt;
  const fG = dayShare(M.cum[K.g], at), fU = dayShare(M.cum[K.u], at), fGG = dayShare(M.cum[K.gg], at);
  const sumW = (list, k) => list.reduce((s, d) => s + M.wk(d, k), 0);
  const w7U = sumW(M.t7, K.u), w7G = sumW(M.t7, K.g), wRU = sumW(M.rest, K.u), wRG = sumW(M.rest, K.g);
  const wTU = M.wk(today, K.u), wTG = M.wk(today, K.g), wTGG = M.wk(today, K.gg);
  const w7GG = sumW(M.t7, K.gg), wRGG = sumW(M.rest, K.gg);
  const blank = () => ({ sfU: 0, sfG: 0, sfGG: 0, dU: 0, dG: 0, dGG: 0, mtdU: 0, mtdG: 0, mtdGG: 0, t7U: 0, t7G: 0, t7GG: 0, title: '' });
  const store = blank(), cats = new Map(), skus = new Map();
  const add = (sku, title, k1, k2, units, gmv, k3, gross) => {
    for (const [m, key] of [[null, null], [cats, catOf(sku)], [skus, sku]]) {
      let x = store;
      if (m) { if (m === skus && !sku) continue; x = m.get(key); if (!x) { x = blank(); m.set(key, x); } }
      x[k1] += units; x[k2] += gmv; x[k3] += gross || 0; if (title && !x.title) x.title = title;
    }
  };
  // Draft Orders count in so-far and month-to-date as booked, but never drive the run-rate or get projected forward
  for (const r of tdy.rows) if (ch.includes(r[2])) { if (r[2] === 'd') add(r[0], r[1], 'dU', 'dG', r[5], r[4], 'dGG', r[6]); else add(r[0], r[1], 'sfU', 'sfG', r[5], r[4], 'sfGG', r[6]); }
  for (const r of P.mtd) if (ch.includes(r[2])) add(r[0], r[1], 'mtdU', 'mtdG', r[3], r[4], 'mtdGG', r[5]);
  for (const r of P.t7) if (ch.includes(r[2]) && r[2] !== 'd') add(r[0], r[1], 't7U', 't7G', r[3], r[4], 't7GG', r[5]);
  const finish = x => {
    x.baseU = x.t7U / w7U; x.baseG = x.t7G / w7G;          // underlying run-rate per average day
    x.d0U = blendProj(x.sfU, fU, x.baseU * wTU) + x.dU; x.d0G = blendProj(x.sfG, fG, x.baseG * wTG) + x.dG;
    x.baseGG = x.t7GG / w7GG; x.d0GG = blendProj(x.sfGG, fGG, x.baseGG * wTGG) + x.dGG;
    x.sfU += x.dU; x.sfG += x.dG; x.sfGG += x.dGG;
    x.mU = x.mtdU + x.d0U + x.baseU * wRU; x.mG = x.mtdG + x.d0G + x.baseG * wRG; x.mGG = x.mtdGG + x.d0GG + x.baseGG * wRGG;
    return x;
  };
  finish(store); cats.forEach(finish); skus.forEach(finish);

}
const hhmm = ts => new Date(ts + 19800000).toISOString().slice(11, 16);
const PROJ_NOTE = () => `Today (D0) = sales so far ÷ the share of a normal day that is usually in by this time (hour-by-hour pattern of every day since 1 Aug 2026). Until about 30% of a normal day is in, it leans on the underlying run-rate × today's weekday factor × today's marketing calendar uplift. Month end = sales up to yesterday + today's projection + each remaining day at run-rate × its weekday factor × its calendar uplift. Run-rate = last 7 days, with their own weekday and uplift weights divided out. GMV is shown two ways: gross sales (before discounts and returns) and net sales (after them), both ex-GST. Draft Orders are counted as booked (so far and month to date) but are not projected forward, and they do not count in the run-rate. Uplift source: ${esc(UPLIFT.source)}.`;
/* the four projection tiles: store (hourly history) when unfiltered, otherwise the filtered SKU-line view */
function ordersProj(chans) {

    <div class="tw"><table><thead>${head('so far')}</thead><tbody>${[R.units, R.gross, R.gmv, R.asp, R.rev, R.orders, R.cust, R.web].map(r => line(r, r.sfX, r.same)).join('')}</tbody></table></div>
    <p class="note">This table leaves out Draft Orders on every day, because Shopify's hour-by-hour data has none (today so far they add ${fN(R.orders.draft)} orders and ${fR(R.gmv.draft)} net sales). App openers come from Linkrunner once per day, not by the hour, so the same-time comparison shows web sessions only. Total traffic and conversion are compared on a full-day basis below. Web sessions exclude those that landed on the Parenting tools pages.</p></section>`;

const ppChipInv = (a, b) => !fin(a) || !fin(b) ? '<span class="dchip flat">–</span>' : `<span class="dchip ${Math.abs(a - b) < 0.00005 ? 'flat' : a > b ? 'down' : 'up'}">${a > b ? '+' : ''}${((a - b) * 100).toFixed(2)} pp</span>`;

/* ---------- store (db) ---------- */
async function dbLoad() {
  if (!S.db) return;
  try {
    const [dSnap, gSnap] = await Promise.all([S.db.collection('days').limit(400).get(), S.db.collection('ga4').limit(400).get()]);
    dSnap.docs.forEach(doc => { const v = doc.data(); if (v) S.days[doc.id] = v; });
    gSnap.docs.forEach(doc => { const v = doc.data(); if (v) S.ga4[doc.id] = v; });
    try { const p = await S.db.doc('proj/latest').get(); const v = p.exists && p.data(); if (v && v.date === today && v.v === PROJ_V) S.proj = v; } catch (e) {}
    await dbLoadSkus();
    await dbLoadReturns();
    const n = Object.keys(S.days).length;
    S.status.db = { st: 'ok', msg: n ? `${n} saved days` : 'No saved days yet' };
  } catch (e) {
    S.status.db = { st: 'err', msg: 'Saved data unavailable' };
  }
}
async function dbLoadReturns() {
  if (!S.db) return;
  try {
    const snap = await S.db.collection('returns').limit(400).get();
    S.returns = S.returns || {};
    snap.docs.forEach(doc => { const v = doc.data(); if (v && v.rows) S.returns[doc.id] = v; });
  } catch (e) { /* returns are optional */ }
}
async function dbLoadSkus() {
  if (!S.db) return;
  const want = [...new Set([...rangeDays(), ...baseDays(), ...cmpDays(), today])].sort().filter(d => !S.skus[d] && d <= today);
  if (!want.length) return;
  const q = want.length <= 30
    ? S.db.collection('skus').where('date', 'in', want)
    : S.db.collection('skus').where('date', '>=', want[0]).where('date', '<=', want[want.length - 1]);
  const snap = await q.limit(200).get();
  snap.docs.forEach(doc => { const v = doc.data(); if (v && v.rows) S.skus[doc.id] = v; });
}
async function dbSave(path, data) {
  if (!S.db || S.canWrite === false) return;
  try { await S.db.doc(path).set(data); }
  catch (e) { if (e && e.code === 'invalid_argument') S.canWrite = false; }
}

/* ---------- refresh ---------- */
/* projection inputs are stale on a new day, after an hour, or whenever today's sales were just re-pulled */
const projStale = (todayRefetched) => !S.proj || S.proj.v !== PROJ_V || S.proj.date !== today || Date.now() - S.proj.fetchedAt > PROJ_MS || !!todayRefetched;
function needsFetch(d, force) {
  if (d > today) return false;
  const D = S.days[d];
  if (!D || D.v !== DATA_V || !D.shop || !D.app || !D.lp || !D.hasSku) return true;
  return force || !D.final;
}
async function refresh(force) {
  if (!S.mcp || S.busy) return;
  S.busy = true; renderChrome();
  const want = [...new Set([...rangeDays(), ...baseDays(), ...cmpDays(), today, addD(today, -1), addD(today, -7), lastMonth(today)])].sort().filter(d => needsFetch(d, force));
  if (!want.length) {
    let pe = null;
    if (projStale()) { try { await fetchProjection(); } catch (e) { pe = e; } }
    S.busy = false;
    S.status[SHOP] = pe ? { st: 'err', msg: errMsg(SHOP, pe), code: pe.code } : { st: 'ok', msg: 'Up to date' };
    S.status[LR] = { st: 'ok', msg: 'Up to date' }; S.lastRefresh = Date.now(); renderAll(); return;
  }
  S.status[SHOP] = { st: 'load', msg: `Loading ${want.length} day(s)` };
  S.status[LR] = { st: 'load', msg: `Loading ${want.length} day(s)` };
  renderChrome();

  let shopErr = null, lrErr = null;
  // 1. store-level sales + web sessions for the span
  try {
    const got = await fetchShopRange(want[0], want[want.length - 1]);
    for (const d of want) if (got[d]) S.days[d] = { ...(S.days[d] || {}), date: d, shop: got[d].shop, sess: got[d].sess };
  } catch (e) { shopErr = e; }
  renderAll();

  // 2. per-day SKU lines and app funnel, three at a time
  const queue = want.slice();
  const worker = async () => {
    while (queue.length) {
      const d = queue.shift();
      const jobs = [];
      let skuOk = false;
      if (!shopErr) jobs.push(fetchSkuDay(d).then(rows => { S.skus[d] = { date: d, rows, fetchedAt: Date.now() }; skuOk = true; }).catch(e => { shopErr = shopErr || e; }));
      if (!shopErr) jobs.push(fetchLpDay(d).then(lp => { S.days[d] = { ...(S.days[d] || {}), date: d, lp }; }).catch(e => { shopErr = shopErr || e; }));
      if (!lrErr) jobs.push(fetchAppDay(d).then(app => { S.days[d] = { ...(S.days[d] || {}), date: d, app }; }).catch(e => { lrErr = lrErr || e; }));
      await Promise.all(jobs);
      const D = S.days[d];
      if (D && skuOk) D.hasSku = true;
      if (D && D.shop && D.app && D.lp && D.hasSku) {
        D.v = DATA_V; D.final = d < yesterday; D.fetchedAt = Date.now();
        await dbSave('days/' + d, D);
        await dbSave('skus/' + d, S.skus[d]);
      }
      renderAll();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  if (!shopErr && projStale(want.includes(today))) { try { await fetchProjection(); } catch (e) { shopErr = e; } }

  const stamp = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  S.status[SHOP] = shopErr ? { st: 'err', msg: errMsg(SHOP, shopErr), code: shopErr.code } : { st: 'ok', msg: 'Live, updated ' + stamp };
  S.status[LR] = lrErr ? { st: 'err', msg: errMsg(LR, lrErr), code: lrErr.code } : { st: 'ok', msg: 'Live, updated ' + stamp };
  if (S.db && S.canWrite === false) S.status.db = { st: 'ok', msg: 'Read-only for you (live data not saved)' };
  else if (S.db) S.status.db = { st: 'ok', msg: `${Object.keys(S.days).length} saved days` };
  S.busy = false; S.lastRefresh = Date.now();
  renderAll();
}

/* ---------- live tier: today only, every 2 minutes ----------
   The hourly refresh re-pulls two months of history. This re-pulls just TODAY (a handful of small
   queries) so D0, the projections and today's rows move in near real time while the page is open.
   Each tick also saves a small live/d0 record; every open page subscribes to it, so viewers
   without the connectors follow along as long as one connected viewer has the page open. */
const LIVE_MS = 2 * 60 * 1000;
function applyToday(day, hoursToday, skuDoc, at) {
  if (day) S.days[today] = day;
  if (skuDoc) S.skus[today] = skuDoc;
  if (hoursToday && S.proj && S.proj.v === PROJ_V && S.proj.date === today) S.proj = { ...S.proj, hours: { ...S.proj.hours, [today]: hoursToday }, fetchedAt: at };
  S.lastRefresh = at; S.lastLive = at;
}
const typing = () => { const a = document.activeElement; return !!(a && main.contains(a) && /^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)); };
const paint = () => { if (typing()) renderChrome(); else renderAll(); };   // never redraw under someone typing in a search box
async function liveTick() {
  if (!S.mcp || S.busy || S.liveBusy || document.hidden) return;
  if (nowIST().toISOString().slice(0, 10) !== today) { location.reload(); return; }
  if (!S.proj || S.proj.v !== PROJ_V || S.proj.date !== today || !S.days[today]) return;   // the full refresh has not landed yet
  S.liveBusy = true; renderChrome();
  try {
    const [rng, rows, lp, hs, hw] = await Promise.all([
      fetchShopRange(today, today), fetchSkuDay(today), fetchLpDay(today),
      shopQ(`FROM sales SHOW orders, net_sales, quantity_ordered, customers, sales_reversals, gross_sales WHERE sales_channel != 'Draft Orders' TIMESERIES hour SINCE ${today} UNTIL ${today} LIMIT 200`),
      shopQ(`FROM sessions SHOW sessions WHERE ${NO_TOOLS} TIMESERIES hour SINCE ${today} UNTIL ${today} LIMIT 200`),
    ]);
    let app = null; try { app = await fetchAppDay(today); } catch (e) { /* keep the last app numbers */ }
    const hrs = Array.from({ length: 24 }, () => [0, 0, 0, 0, 0, 0, 0]);
    const slot = ts => { const t = new Date(Date.parse(ts) + 19800000); return t.toISOString().slice(0, 10) === today ? hrs[t.getUTCHours()] : null; };
    for (const r of hs) { const x = slot(r.hour); if (x) { x[0] += num(r.quantity_ordered); x[1] += Math.round(num(r.net_sales)); x[2] += num(r.orders); x[3] += num(r.customers); x[5] += Math.round(-num(r.sales_reversals)); x[6] += Math.round(num(r.gross_sales)); } }
    for (const r of hw) { const x = slot(r.hour); if (x) x[4] += num(r.sessions); }
    const at = Date.now(), prev = S.days[today] || {};
    const day = { ...prev, date: today, v: DATA_V, shop: rng[today].shop, sess: rng[today].sess || prev.sess, lp, app: app || prev.app, hasSku: true, final: false, fetchedAt: at };
    applyToday(day, hrs, { date: today, rows, fetchedAt: at }, at);
    S.status[SHOP] = { st: 'ok', msg: 'Live, updated ' + hhmm(at) }; if (app) S.status[LR] = { st: 'ok', msg: 'Live, updated ' + hhmm(at) };
    S.liveN = (S.liveN || 0) + 1;
    if (S.db && S.canWrite !== false) {
      const skuAt = S.liveN % 5 === 1 ? at : (S.liveSkuAt || 0);   // SKU lines are the big document: share them every 5th tick
      try {
        if (skuAt === at) { await S.db.doc('skus/' + today).set(S.skus[today]); S.liveSkuAt = at; }
        await S.db.doc('days/' + today).set(day);
        await S.db.doc('live/d0').set({ date: today, fetchedAt: at, hours: hrs, day, skuAt: S.liveSkuAt || 0 });
      } catch (e) { if (e && e.code === 'invalid_argument') S.canWrite = false; }
    }
  } catch (e) {
    S.status[SHOP] = { st: 'err', msg: errMsg(SHOP, e), code: e && e.code };
  } finally { S.liveBusy = false; paint(); }
}
/* every page follows the shared live record, so a viewer without connectors sees D0 move too */
function followLive() {
  if (!S.db) return;
  try {
    S.db.doc('live/d0').onSnapshot(async snap => {
      const v = snap.exists && snap.data();
      const mine = Math.max(S.lastLive || 0, (S.proj && S.proj.date === today && S.proj.fetchedAt) || 0);   // what this page's hour data is already as fresh as
      if (!v || v.date !== today || !(v.fetchedAt > mine)) return;   // ignore our own and older records
      let skuDoc = null;
      if (v.skuAt && v.skuAt !== S.liveSkuAt) { try { const d = await S.db.doc('skus/' + today).get(); if (d.exists) { skuDoc = d.data(); S.liveSkuAt = v.skuAt; } } catch (e) {} }
      if (!S.proj || S.proj.date !== today) { try { const pdoc = await S.db.doc('proj/latest').get(); const pv = pdoc.exists && pdoc.data(); if (pv && pv.date === today && pv.v === PROJ_V) S.proj = pv; } catch (e) {} }
      applyToday(v.day, v.hours, skuDoc, v.fetchedAt);
      S.sharedLive = true; paint();
    }, () => {});
  } catch (e) {}
}

/* ---------- GA4 import ---------- */
function parseCsvLine(line) {
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === ',') { out.push(cur); cur = ''; } else cur += c;
  }
  out.push(cur); return out;
}
function parseGa4(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#'));
  if (lines.length < 2) throw new Error('The file has no data rows.');
  const head = parseCsvLine(lines[0]).map(h => h.trim().toLowerCase());
  const find = re => head.findIndex(h => re.test(h));
  const ix = {
    date: find(/^date$/), plat: find(/^(platform|stream name|device category)$/),
    users: find(/^(total users|users|active users)$/), sessions: find(/^sessions$/),
    atc: find(/add.?to.?carts?/), checkout: find(/^checkouts?$|begin.?checkout/), purchases: find(/^(transactions|ecommerce purchases|purchases)$/),
  };
  if (ix.date < 0) throw new Error('No "Date" column. Build the GA4 Exploration with the Date dimension (not Day).');
  if (ix.sessions < 0 && ix.users < 0) throw new Error('No Sessions or Total users column found.');
  const out = {};
  for (const l of lines.slice(1)) {
    const c = parseCsvLine(l);
    const raw = (c[ix.date] || '').replace(/\D/g, '');
    if (raw.length !== 8) continue; // skips the grand-total row
    const d = `${raw.slice(0, 4)}-${raw.slice(4, 6)}-${raw.slice(6, 8)}`;
    const p = ix.plat >= 0 ? (c[ix.plat] || '').toLowerCase() : 'all';
    const bucket = p === 'all' ? 'all' : /web|desktop|tablet|mobile/.test(p) && !/android|ios/.test(p) ? 'web' : /android|ios|app/.test(p) ? 'app' : null;
    if (!bucket) continue;
    const g = (k) => ix[k] >= 0 ? num((c[ix[k]] || '').replace(/,/g, '')) : NaN;
    const rec = out[d] || (out[d] = { date: d });
    const t = rec[bucket] || (rec[bucket] = { users: 0, sessions: 0, atc: 0, checkout: 0, purchases: 0 });
    for (const k of ['users', 'sessions', 'atc', 'checkout', 'purchases']) { const v = g(k); if (fin(v)) t[k] += v; }
  }
  return out;
}
async function importGa4(file) {
  const box = document.getElementById('ga4msg');
  try {
    const parsed = parseGa4(await file.text());
    const ds = Object.keys(parsed).sort();
    if (!ds.length) throw new Error('No dated rows found. Check the export has a Date column in YYYYMMDD form.');
    for (const d of ds) {
      const merged = { ...(S.ga4[d] || {}), ...parsed[d], importedAt: Date.now(), file: file.name.slice(0, 80) };
      S.ga4[d] = merged;
      await dbSave('ga4/' + d, merged);
    }
    const saved = S.db && S.canWrite !== false;
    box.innerHTML = `Imported ${ds.length} day(s), ${fd(ds[0])} to ${fd(ds[ds.length - 1])}. ${saved ? 'Saved for everyone who opens this page.' : 'Kept for this visit only (you cannot save data to this page).'}`;
    renderAll();
  } catch (e) {
    box.innerHTML = `<span class="down">${esc(e.message || e)}</span>`;
  }
}

/* ---------- render: chrome ---------- */
function renderChrome() {
  const cd = document.getElementById('countdown');
  if (today < SALE.start) { const n = saleDay(today) * -1 + 1; cd.textContent = `Starts in ${n} day${n === 1 ? '' : 's'}`; }
  else if (today <= SALE.end) cd.textContent = `Day ${saleDay(today)} of 39`;
  else cd.textContent = 'Sale ended 8 Nov';

  const strip = document.getElementById('strip');
  strip.innerHTML = days(SALE.start, SALE.end).map(d => {
    const cls = [S.days[d] && S.days[d].shop ? 'has' : '', FLASH.includes(d) ? 'flash' : '', d === today ? 'today' : '', d >= S.from && d <= S.to ? 'sel' : ''].join(' ');
    return `<button class="${cls}" data-d="${d}" title="${fdw(d)}${FLASH.includes(d) ? ', Flash Sale' : ''}" aria-label="${fdw(d)}"${d > today ? ' disabled' : ''}></button>`;
  }).join('');

  document.getElementById('from').value = S.from; document.getElementById('to').value = S.to;
  document.getElementById('catSel').value = S.cat;
  document.querySelectorAll('#presets button').forEach(b => { const r = preset(b.dataset.p); b.setAttribute('aria-pressed', r && r[0] === S.from && r[1] === S.to ? 'true' : 'false'); });
  document.querySelectorAll('#plat button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === S.plat)));
  const hasGa4 = rangeDays().some(d => S.ga4[d]);
  if (!hasGa4 && S.src === 'ga4') S.src = 'live';
  document.querySelectorAll('#srcSeg button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.v === S.src)); if (b.dataset.v === 'ga4') b.disabled = !hasGa4; });
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.t === S.tab)));
  const rb = document.getElementById('refresh');
  rb.disabled = !S.mcp || S.busy; rb.textContent = S.busy ? 'Loading…' : 'Refresh data';

  const ga4n = Object.keys(S.ga4).length;
  const chip = (k, label) => { const s = S.status[k]; return `<span class="src ${s.st === 'ok' ? 'ok' : s.st === 'load' ? 'load' : s.st === 'err' ? 'err' : ''}" title="${esc(s.msg)}"><i></i><b>${label}</b> <span class="muted">${esc(s.st === 'err' ? 'Error, see below' : s.msg)}</span></span>`; };
  document.getElementById('sources').innerHTML =
    chip(SHOP, 'Shopify') + chip(LR, 'Linkrunner') + chip('db', 'Saved data') +
    `<span class="src ${S.busy || S.liveBusy ? 'load' : S.lastRefresh ? 'ok' : ''}"><i></i><b>D0 = ${fdw(today)}</b> <span class="muted">${S.busy || S.liveBusy ? 'updating now' : S.lastRefresh ? `live, updated ${hhmm(S.lastRefresh)} IST` : 'loading'} · ${S.mcp ? 'today refreshes every 2 min' : 'follows the shared live feed'}</span></span>` +
    `<span class="src ${ga4n ? 'ok' : ''}"><i></i><b>GA4</b> <span class="muted">${ga4n ? ga4n + ' imported days' : 'Not connected, import on Sources tab'}</span></span>`;

  const errs = [SHOP, LR].filter(k => S.status[k].st === 'err');
  const al = document.getElementById('pageAlert');
  if (errs.length) { al.hidden = false; al.className = 'alert'; al.innerHTML = errs.map(k => esc(S.status[k].msg)).join('<br>') + (Object.keys(S.days).length ? '<br><span class="muted">Showing the last saved data where it exists.</span>' : ''); }
  else al.hidden = true;
}

/* ---------- render: day view ---------- */
function chartSvg(dl, baseAvg) {
  const W = Math.max(320, (document.getElementById('main').clientWidth || 900) - 30), H = 230;
  const L = 44, R = 10, T = 12, B = 28;
  const vals = dl.map(d => { const m = dayMetrics(d, 'total', 'live'); return { d, w: m.ordersW || 0, a: m.ordersA || 0, o: m.ordersO || 0, has: fin(m.orders) }; });
  const max = Math.max(1, baseAvg || 0, ...vals.map(v => v.w + v.a + v.o));
  const step = [10, 20, 50, 100, 200, 250, 500, 1000, 2000].find(s => max / s <= 5) || 5000;
  const top = Math.ceil(max / step) * step;
  const y = v => T + (H - T - B) * (1 - v / top);
  const bw = (W - L - R) / Math.max(1, vals.length);
  let g = '';
  for (let t = 0; t <= top; t += step) g += `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 6}" y="${y(t) + 4}" text-anchor="end">${t.toLocaleString('en-IN')}</text>`;
  const every = Math.ceil(vals.length / Math.floor((W - L) / 56));
  vals.forEach((v, i) => {
    const x = L + i * bw + bw * 0.14, w = Math.max(2, bw * 0.72);
    if (FLASH.includes(v.d)) g += `<rect x="${L + i * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="var(--flash)" opacity="0.08"/>`;
    let yy = y(0);
    for (const [k, col] of [['w', 'var(--web)'], ['a', 'var(--app)'], ['o', 'var(--other)']]) {
      const h = y(0) - y(v[k]); if (h <= 0) continue;
      yy -= h; g += `<rect x="${x}" y="${yy}" width="${w}" height="${h}" fill="${col}"${v.d === today ? ' opacity="0.55"' : ''}><title>${fdw(v.d)}: web ${fN(v.w)}, app ${fN(v.a)}, other ${fN(v.o)}</title></rect>`;
    }
    if (i % every === 0) g += `<text x="${L + i * bw + bw / 2}" y="${H - 9}" text-anchor="middle">${fd(v.d)}</text>`;
  });
  if (baseAvg) g += `<line x1="${L}" x2="${W - R}" y1="${y(baseAvg)}" y2="${y(baseAvg)}" stroke="var(--ink)" stroke-dasharray="5 4" stroke-width="1.2"/><text x="${W - R}" y="${y(baseAvg) - 5}" text-anchor="end" style="fill:var(--ink)">pre-sale avg ${fN(baseAvg)}/day</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Orders per day by platform">${g}</svg>`;
}

function renderDay() {
  const dl = rangeDays();
  const ms = dl.map(d => ({ d, m: dayMetrics(d, S.plat, S.src) }));
  const tot = sumMetrics(ms.map(x => x.m));
  const bl = baseDays().map(d => dayMetrics(d, S.plat, S.src));
  const bt = sumMetrics(bl);
  const bOrd = bt.n ? bt.orders / bt.n : NaN;
  const bTotal = sumMetrics(baseDays().map(d => dayMetrics(d, 'total', 'live')));
  const convT = tot.conv, convB = bt.conv;
  const avgOrd = tot.n ? tot.orders / tot.n : NaN;
  const px = S.plat !== 'web' && S.src === 'live';

  if (!tot.n && !tot.nf) return emptyState();

  const kpi = (label, v, d) => `<div class="kpi"><span class="eyebrow">${label}</span><span class="v">${v}</span><span class="d muted">${d || '&nbsp;'}</span></div>`;
  let h = `<div class="kpis">
    ${kpi(S.plat === 'total' ? 'Orders (excl. Draft Orders)' : 'Orders', fN(tot.orders), `${fN(avgOrd)}/day · ${delta(avgOrd, bOrd)} vs pre-sale`)}
    ${kpi('Net sales', fR(tot.net), `${fR(tot.n ? tot.net / tot.n : NaN)}/day`)}
    ${kpi('Conversion', fP(convT), `orders ÷ ${px ? 'sessions + app openers' : 'sessions'} · pre-sale ${fP(convB)}`)}
    ${kpi('AOV web', fR(tot.aovW), `pre-sale ${fR(bt.aovW)}`)}
    ${kpi('AOV app', fR(tot.aovA), `pre-sale ${fR(bt.aovA)}`)}
    ${kpi('App share of orders', fP(div(tot.ordersA, tot.ordersW + tot.ordersA), 0), 'web + app orders only')}
  </div>`;

  h += `<section class="panel chart"><div class="panel-head"><h2>Orders per day</h2>
    <div class="legend"><span><b style="background:var(--web)"></b>Web</span><span><b style="background:var(--app)"></b>App</span><span><b style="background:var(--other)"></b>Other (subscriptions)</span><span><b style="background:var(--flash);opacity:.35"></b>Flash Sale day</span></div></div>
    ${chartSvg(dl, bTotal.n ? bTotal.orders / bTotal.n : 0)}</section>`;

  const col = (v, na) => fin(v) ? `<td class="n">${fN(v)}</td>` : `<td class="n na" title="${na || 'Not loaded'}">–</td>`;
  const rows = ms.map(({ d, m }) => {
    const ph = phase(d);

/* ---------- render: category ---------- */
function lineDayTable(test, label) {

  const rows = dl.map(d => { const r = lineDay(d, test); const ph = phase(d);
    return `<tr><td>${fdw(d)}${ph ? `<span class="pill ${ph[0]}">${ph[1]}</span>` : ''}</td>${r ? `<td class="n">${fN(r.orders)}</td><td class="n">${fN(r.oW)}</td><td class="n">${fN(r.oA)}</td><td class="n">${fN(r.units)}</td><td class="n">${fR(r.gross)}</td><td class="n">${fR(r.net)}</td><td class="n">${fR(div(r.net, r.units))}</td><td class="n">${fR(r.rev)}</td><td class="n">${fR(div(r.nW, r.oW))}</td><td class="n">${fR(div(r.nA, r.oA))}</td>` : '<td class="n na" colspan="10">Not loaded</td>'}<td class="n na" title="Needs GA4 item-level export">–</td><td class="n na" title="Needs GA4 item-level export">–</td></tr>`; }).join('');
  return `<section class="panel"><div class="panel-head"><h2>${esc(label)} · by day</h2><span class="small muted">Shopify order lines</span></div>
    <div class="tw"><table><thead><tr><th>Day</th><th class="n">Orders</th><th class="n">Web</th><th class="n">App</th><th class="n">Units</th><th class="n">GMV (gross sales)</th><th class="n">GMV (net sales)</th><th class="n">ASP</th><th class="n">Sales reversals</th><th class="n">AOV (Web)</th><th class="n">AOV (App)</th><th class="n">Sessions</th><th class="n">Add to cart</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Sessions and Add to cart by category or SKU are not in Shopify or Linkrunner. They need a GA4 item-level export (Item name x Date: items viewed, items added to cart). AOV here is this line's net sales per order that contains it, not the whole basket.</p></section>`;
}
function renderCat() {
  const dl = rangeDays();
  const agg = skuAgg(dl);
  if (!agg.length) return projTable('cat') + emptyState();
  const by = new Map();
  for (const r of agg) {
    let c = by.get(r.cat); if (!c) { c = { cat: r.cat, oW: 0, oA: 0, oO: 0, nW: 0, nA: 0, nO: 0, units: 0, gross: 0, rev: 0, skus: 0 }; by.set(r.cat, c); }
    c.rev += r.rev; c.gross += r.gross; c.oW += r.oW; c.oA += r.oA; c.oO += r.oO; c.nW += r.nW; c.nA += r.nA; c.nO += r.nO; c.units += r.units; if (r.orders > 0) c.skus++;
  }
  const cats = [...by.values()].map(c => ({ ...c, orders: c.oW + c.oA + c.oO, net: c.nW + c.nA + c.nO })).sort((a, b) => b.net - a.net);
  const totNet = cats.reduce((s, c) => s + c.net, 0);
  const bAgg = skuAgg(baseDays()); const bCat = {}; const bn = baseDays().filter(d => S.skus[d]).length;
  for (const r of bAgg) bCat[r.cat] = (bCat[r.cat] || 0) + r.orders;
  const nd = dl.filter(d => S.skus[d]).length;
  const rows = cats.map(c => `<tr class="pick${S.selCat === c.cat ? ' sel' : ''}" data-cat="${esc(c.cat)}" tabindex="0"><td>${esc(c.cat)}</td><td class="n">${fN(c.orders)}</td><td class="n">${fN(c.oW)}</td><td class="n">${fN(c.oA)}</td><td class="n">${fN(c.units)}</td><td class="n">${fR(c.gross)}</td><td class="n">${fR(c.net)}</td><td class="n">${fR(div(c.net, c.units))}</td><td class="n">${fR(c.rev)}</td><td class="n">${fP(div(c.net, totNet), 1)}</td><td class="n">${fR(div(c.nW, c.oW))}</td><td class="n">${fR(div(c.nA, c.oA))}</td><td class="n">${fN(c.skus)}</td><td class="n">${bn && nd && dl[0] >= SALE.start ? delta(c.orders / nd, (bCat[c.cat] || 0) / bn) : '<span class="muted">–</span>'}</td></tr>`).join('');
  let h = projTable('cat') + `<section class="panel"><div class="panel-head"><h2>Categories · ${fd(dl[0])} to ${fd(dl[dl.length - 1])}</h2><span class="small muted">Click a category for its day-wise table</span></div>
    <div class="tw"><table><thead><tr><th>Category</th><th class="n">Orders</th><th class="n">Web</th><th class="n">App</th><th class="n">Units</th><th class="n">GMV (gross sales)</th><th class="n">GMV (net sales)</th><th class="n">ASP</th><th class="n">Sales reversals</th><th class="n">Share of net</th><th class="n">AOV (Web)</th><th class="n">AOV (App)</th><th class="n">SKUs sold</th><th class="n">Orders/day vs pre-sale</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="note">Category comes from the master marketing calendar's SKU map (1,634 live SKUs). Orders count order lines per SKU, so an order with two SKUs from one category counts twice here. Net sales include that day's returns.</p></section>`;
  // heatmap: categories x days (orders)
  if (dl.length > 1) {
    const top = cats.slice(0, 9).map(c => c.cat);
    const grid = top.map(cat => dl.map(d => { const r = lineDay(d, s => catOf(s) === cat); return r ? r.orders : NaN; }));
    const mx = Math.max(1, ...grid.flat().filter(fin));
    const hrows = top.map((cat, i) => `<tr><td>${esc(cat)}</td>${grid[i].map(v => `<td class="n" style="background:color-mix(in srgb, var(--web) ${fin(v) ? Math.round(v / mx * 70) : 0}%, transparent)">${fin(v) ? fN(v) : ''}</td>`).join('')}</tr>`).join('');
    h += `<section class="panel"><div class="panel-head"><h2>Orders by category and day</h2><span class="small muted">Darker = more orders</span></div>
      <div class="tw heat"><table><thead><tr><th>Category</th>${dl.map(d => `<th class="n"${FLASH.includes(d) ? ' style="color:var(--flash)"' : ''}>${fd(d)}</th>`).join('')}</tr></thead><tbody>${hrows}</tbody></table></div></section>`;
  }
  const sel = S.cat && by.has(S.cat) ? S.cat : S.selCat && by.has(S.selCat) ? S.selCat : cats[0].cat;
  h += lineDayTable(s => catOf(s) === sel, sel);
  return h;
}

/* ---------- render: returns ----------
   Returns, refunds and cancellations, by the day they were booked (same basis as Sales reversals).
   Built hourly from Shopify orders (refund lines, return notes, refund notes, cancellation tags) by the scheduled
   refresh and saved as returns/<date>: rows [sku, title, kind, reason, units, value ex-GST, [order names]]. */
const RKINDS = ['Customer return', 'RTO (not delivered)', 'Cancelled', 'Other refund'];
/* D0 returns, laid out like the D0 tab: so far vs the same time on D-1 / D-7 / same date last month, projected full day,
   then reasons, categories and products for today. Hour-by-hour from returns/<date>.hrs and each row's {hour: [units, value]}. */
/* When today has no returns saved yet (before the first hourly build, or a demo), show the latest day that has them,
   as whole days against D-1, D-7 and the same date last month. */
function retLatestDay() {
  const R = S.returns || {};
  const D = Object.keys(R).filter(d => d < today).sort().pop();
  if (!D) return `<section class="panel"><div class="empty">Today's returns load with the next hourly refresh.</div></section>`;
  const inCat = sku => !S.cat || catOf(sku) === S.cat;
  const cmp = [[addD(D, -1), 'D-1'], [addD(D, -7), 'D-7'], [lastMonth(D), 'Last month']];
  const soldDay = d => { const s = S.skus[d]; if (!s) return NaN; let u = 0; for (const r of s.rows) if (r[2] !== 'd' && CHANS().includes(r[2]) && inCat(r[0])) u += r[5]; return u; };
  const sum = d => { if (!R[d]) return null; const o = { units: 0, value: 0, orders: new Set(), k: {}, cat: new Map(), sku: new Map() };
    for (const r of R[d].rows) { if (!inCat(r[0])) continue; o.units += r[4]; o.value += r[5]; r[6].forEach(x => o.orders.add(x)); o.k[r[2]] = (o.k[r[2]] || 0) + r[4];
      for (const [m, key] of [[o.cat, catOf(r[0])], [o.sku, r[0] || '(no SKU) ' + r[1]]]) { const x = m.get(key) || { units: 0, value: 0, title: r[1], k: {} }; x.units += r[4]; x.value += r[5]; x.k[r[2]] = (x.k[r[2]] || 0) + r[4]; m.set(key, x); } }
    o.sold = soldDay(d); return o; };
  const cur = sum(D), past = cmp.map(([d]) => sum(d));
  const rows = [['Units returned', o => o.units, fN], ['Orders affected', o => o.orders.size, fN], ['Value (ex-GST)', o => o.value, fR], ...RKINDS.map(k => [`${k} (units)`, o => o.k[k] || 0, fN])];
  const rate = o => (o ? div(o.units, o.sold) : NaN);
  const tile = ([lab, f, fmt]) => `<div class="tile d0"><span class="eyebrow">${esc(lab)}</span><span class="v">${fmt(f(cur))}</span>
      <div class="cmprow">${cmp.map(([d, l], i) => `<span class="cmpc"><span class="muted">${l}</span> ${past[i] ? chip(pct(f(cur), f(past[i])), `${l} (${fdw(d)})`, true) : '<span class="dchip flat">–</span>'}</span>`).join('')}</div></div>`;
  const rateTile = `<div class="tile d0"><span class="eyebrow">Return rate (units returned ÷ units sold)</span><span class="v">${fP(rate(cur), 1)}</span>
      <div class="cmprow">${cmp.map(([, l], i) => `<span class="cmpc"><span class="muted">${l}</span> ${ppChipInv(rate(cur), rate(past[i]))}</span>`).join('')}</div></div>`;
  const head = `<tr><th>Metric</th><th class="n">${fd(D)}</th>${cmp.map(([d, l]) => `<th class="n">${l} · ${fd(d)}</th><th class="n">vs ${l}</th>`).join('')}</tr>`;
  const line = ([lab, f, fmt]) => `<tr><td>${esc(lab)}</td><td class="n"><b>${fmt(f(cur))}</b></td>${past.map(p => `<td class="n">${p ? fmt(f(p)) : '<span class="muted">–</span>'}</td><td class="n">${p ? chip(pct(f(cur), f(p)), '', true) : '–'}</td>`).join('')}</tr>`;
  const top = (title, key, label, n) => {
    const m = cur[key], keys = [...m.keys()].sort((a, b) => m.get(b).units - m.get(a).units).slice(0, n);
    return `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="small muted">Units returned on ${fd(D)} vs the same day each comparison</span></div>
      <div class="tw" style="max-height:420px"><table><thead><tr><th>${label}</th>${key === 'sku' ? '<th>Product</th>' : ''}<th class="n">Units</th><th class="n">Value</th>${RKINDS.map(k => `<th class="n">${esc(k)}</th>`).join('')}${cmp.map(([, l]) => `<th class="n">${l}</th><th class="n">vs ${l}</th>`).join('')}</tr></thead><tbody>
      ${keys.map(k => { const x = m.get(k); return `<tr><td${key === 'sku' ? ' class="num"' : ''}>${esc(k)}</td>${key === 'sku' ? `<td class="title">${esc(x.title)}</td>` : ''}<td class="n"><b>${fN(x.units)}</b></td><td class="n">${fR(x.value)}</td>${RKINDS.map(kk => `<td class="n">${x.k[kk] ? fN(x.k[kk]) : '<span class="muted">–</span>'}</td>`).join('')}${past.map(p => { const y = p && p[key].get(k); return `<td class="n">${p ? fN(y ? y.units : 0) : '–'}</td><td class="n">${p ? chip(pct(x.units, y ? y.units : 0), '', true) : '–'}</td>`; }).join('')}</tr>`; }).join('')}
      </tbody></table></div></section>`;
  };
  return `<section class="panel"><div class="panel-head"><h2>Latest day returns, refunds and cancellations · ${fdw(D)}${S.cat ? ' · ' + esc(S.cat) : ''}</h2>
      <span class="small muted">Today's returns are not saved yet, so this shows the latest day that has them, as whole days · a rise is red</span></div>
    <div class="tiles">${rows.slice(0, 3).map(tile).join('')}${rateTile}${rows.slice(3).map(tile).join('')}</div></section>
    <section class="panel"><div class="panel-head"><h2>${fd(D)} vs D-1, D-7 and last month</h2></div>
    <div class="tw"><table><thead>${head}</thead><tbody>${rows.map(line).join('')}
      <tr><td>Return rate (units returned ÷ units sold)</td><td class="n"><b>${fP(rate(cur), 1)}</b></td>${past.map(p => `<td class="n">${fP(rate(p), 1)}</td><td class="n">${ppChipInv(rate(cur), rate(p))}</td>`).join('')}</tr></tbody></table></div></section>` +
    top(`${fd(D)} by category`, 'cat', 'Category', 20) + top(`${fd(D)} by product`, 'sku', 'SKU', 50);
}
function retD0() {
  const R = S.returns || {}, T = R[today];
  if (!T) return retLatestDay();
  const ts = T.fetchedAt, t = new Date(ts + 19800000), H = t.getUTCHours(), Mi = t.getUTCMinutes(), at = hhmm(ts);
  const cmp = [[addD(today, -1), 'D-1'], [addD(today, -7), 'D-7'], [lastMonth(today), 'Last month']];
  const inCat = sku => !S.cat || catOf(sku) === S.cat;
  // per day: 24 hourly slots of [units, value, orders] for one kind ('All' or a type), honouring the category filter
  const slots = (d, kind) => {
    const doc = R[d]; if (!doc) return null;
    if (!S.cat && doc.hrs) { const a = doc.hrs[kind]; return a || Array.from({ length: 24 }, () => [0, 0, 0]); }
    const a = Array.from({ length: 24 }, () => [0, 0, NaN]);
    for (const r of doc.rows) if ((kind === 'All' || r[2] === kind) && inCat(r[0])) for (const [h, [u, v]] of Object.entries(r[7] || {})) { a[+h][0] += u; a[+h][1] += v; }
    return a;
  };
  const upto = (a, i) => { if (!a) return NaN; let x = 0; for (let h = 0; h < H; h++) x += a[h][i]; return x + a[H][i] * Mi / 60; };
  const whole = (a, i) => (a ? a.reduce((x, s) => x + s[i], 0) : NaN);
  // usual share of a day's returned units in by this time, from every complete day saved since 1 Aug
  const hist = Object.keys(R).filter(d => d < today && d >= HIST_START).sort();
  const cum = Array(24).fill(0); for (const d of hist) (slots(d, 'All') || []).forEach((s, h) => { cum[h] += s[0]; });
  const tot = cum.reduce((a, b) => a + b, 0) || 1; let c = 0; const cumS = cum.map(v => (c += v) / tot);
  const share = dayShare(cumS, ts);
  const last7 = days(addD(today, -7), addD(today, -1)).filter(d => R[d]);
  const metric = (key, label, kind, i, fmt) => {
    const a = slots(today, kind), sf = whole(a, i), base = last7.length ? last7.reduce((x, d) => x + whole(slots(d, kind), i), 0) / last7.length : NaN;
    return { key, label, fmt, inv: true, sf, proj: blendProj(sf, share, base), same: cmp.map(([d]) => upto(slots(d, kind), i)), full: cmp.map(([d]) => whole(slots(d, kind), i)) };
  };
  const M = {
    units: metric('units', 'Units returned', 'All', 0, fN), orders: metric('orders', 'Orders affected', 'All', 2, fN), value: metric('value', 'Value (ex-GST)', 'All', 1, fR),
    ...Object.fromEntries(RKINDS.map(k => [k, metric(k, `${k} (units)`, k, 0, fN)])),
  };
  if (S.cat) { M.orders.sf = new Set(T.rows.filter(r => inCat(r[0])).flatMap(r => r[6])).size; M.orders.proj = NaN; M.orders.same = [NaN, NaN, NaN]; M.orders.full = cmp.map(([d]) => R[d] ? new Set(R[d].rows.filter(r => inCat(r[0])).flatMap(r => r[6])).size : NaN); }
  // return rate = units returned / units sold (whole store; Shopify's hour data for units sold)
  const V = !S.cat ? d0View() : null;
  M.rate = V ? { key: 'rate', label: 'Return rate (units returned ÷ units sold)', fmt: v => fP(v, 1), inv: true, sf: div(M.units.sf, V.rows.units.sf), proj: div(M.units.proj, V.rows.units.proj),
    same: cmp.map((_, i) => div(M.units.same[i], V.rows.units.same[i])), full: cmp.map((_, i) => div(M.units.full[i], V.rows.units.full[i])) } : null;
  const list = [M.units, M.orders, M.value, M.rate, ...RKINDS.map(k => M[k])].filter(Boolean);
  const chips = (r, cur, arr, tip) => cmp.map(([d, lab], i) => `<span class="cmpc"><span class="muted">${lab}</span> ${r.key === 'rate' ? ppChipInv(cur, arr[i]) : chip(pct(cur, arr[i]), `${lab} (${fdw(d)}) ${tip}`, true)}</span>`).join('');
  const tile = r => `<div class="tile d0"><span class="eyebrow">${esc(r.label)}</span><span class="v">${r.fmt(r.sf)}</span>
      <span class="d">so far · projected full day <b>${r.fmt(r.proj)}</b></span>
      <div class="cmprow">${chips(r, r.sf, r.same, 'at the same time of day')}</div><span class="d">vs the same time (${at}) on those days · a rise is red</span></div>`;
  let h = `<section class="panel"><div class="panel-head"><h2>D0 returns, refunds and cancellations · ${fdw(today)}${S.cat ? ' · ' + esc(S.cat) : ''}</h2>
      <span class="small muted">Data as of ${at} IST · updated hourly · ${Math.round(share * 100)}% of a normal day's returns are usually booked by now</span></div>
    <div class="tiles">${list.map(tile).join('')}</div></section>`;
  const head = a => `<tr><th>Metric</th><th class="n">D0 ${a}</th>${cmp.map(([d, lab]) => `<th class="n">${lab} · ${fd(d)}</th><th class="n">vs ${lab}</th>`).join('')}</tr>`;
  const line = (r, cur, arr) => `<tr><td>${esc(r.label)}</td><td class="n"><b>${fin(cur) ? r.fmt(cur) : '–'}</b></td>${arr.map(v => `<td class="n">${fin(v) ? r.fmt(v) : '<span class="muted">–</span>'}</td><td class="n">${r.key === 'rate' ? ppChipInv(cur, v) : chip(pct(cur, v), '', true)}</td>`).join('')}</tr>`;
  h += `<section class="panel"><div class="panel-head"><h2>So far today vs the same time on D-1, D-7 and last month</h2><span class="small muted">Everything booked up to ${at} IST on each day</span></div>
    <div class="tw"><table><thead>${head('so far')}</thead><tbody>${list.map(r => line(r, r.sf, r.same)).join('')}</tbody></table></div></section>`;
  h += `<section class="panel"><div class="panel-head"><h2>Full day: D0 projected vs D-1, D-7 and last month</h2><span class="small muted">Today's projected close against what those days finished at</span></div>
    <div class="tw"><table><thead>${head('projected')}</thead><tbody>${list.map(r => line(r, r.proj, r.full)).join('')}</tbody></table></div>
    <p class="note">Projected full day = returns so far ÷ the share of a normal day's returns usually booked by this time; until about 30% is in, it leans on the last 7 days' average. Return rate change is in percentage points (pp). Orders at the same time of day add up each hour's orders. A rise in returns is shown in red.</p></section>`;
  // today's detail with the same-time comparison, for reasons, categories and products
  const rowsOf = d => (R[d] ? R[d].rows.filter(r => inCat(r[0])) : null);
  const sumUpto = (r) => { let x = 0; for (const [hh, [u]] of Object.entries(r[7] || {})) { const n = +hh; x += n < H ? u : n === H ? u * Mi / 60 : 0; } return x; };
  const detail = (title, keyf, labf, extra) => {
    const m = new Map();
    const add = (d, i, r) => { const k = keyf(r); let g = m.get(k); if (!g) { g = { k, r, u: 0, v: 0, o: new Set(), same: [0, 0, 0], why: {} }; m.set(k, g); }

/* ---------- render: comparison ----------

function cmpModel() {
  const [a, d1, d7, lm] = cmpDays();
  const isT = a === today;
  const cols = [[a, isT ? 'D0' : 'Selected day'], [d1, 'D-1'], [d7, 'D-7'], [lm, 'Same date last month']];
  const cdm = cols.map(([d]) => catDay(d)), lpm = cols.map(([d]) => lpDay(d));
  const extras = [MIXED, UNMAPPED_PAGES, OTHER_PAGES];
  const cats = new Set(); cdm.forEach(m => m && Object.keys(m).forEach(c => cats.add(c)));
  lpm.forEach(l => l && Object.keys(l).forEach(c => { if (!extras.includes(c)) cats.add(c); }));
  let list = [...cats].filter(c => c !== NO_SKU);
  if (S.cat) list = list.filter(c => c === S.cat);
  const raw = (i, c, k) => k === 'traffic' ? (lpm[i] ? (lpm[i][c] ? lpm[i][c][0] : 0) : NaN) : (cdm[i] ? (cdm[i][c] ? cdm[i][c][k] : 0) : NaN);
  const pa = isT ? projAll() : null, M = isT ? projModel() : null, D = S.days[today];
  const fS = isT && M && D && D.fetchedAt ? dayShare(M.cum[K.s], D.fetchedAt) : NaN;
  const fRv = isT && M && D && D.fetchedAt ? dayShare(M.cum[K.r], D.fetchedAt) : NaN;
  const cur = (c, k) => {
    if (!isT) return raw(0, c, k);

    if (k === 'rev') { const v = raw(0, c, k); return fin(v) && fRv > 0.05 ? Math.max(v, v / fRv) : NaN; }
    if (!pa) return NaN;
    const x = pa.cats.get(c); return x ? (k === 'units' ? x.d0U : k === 'gross' ? x.d0GG : x.d0G) : 0;
  };
  const missing = cols.filter(([d], i) => !cdm[i] || (!lpm[i] && S.plat !== 'app')).map(([d]) => fd(d));
  return { a, d1, d7, lm, isT, cols, list, raw, cur, missing, projReady: !isT || !!pa, asOf: pa ? pa.asOf : (D && D.fetchedAt) || 0 };
}

  const aoa = [head, ...rows.map(r => r.map((v, i) => fmts[i] === 'd' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? new Date(v + 'T00:00:00Z') : clean(v)))];
  const ws = X.utils.aoa_to_sheet(aoa, { cellDates: true });
  for (let r = 1; r < aoa.length; r++) fmts.forEach((f, c) => { const cell = ws[X.utils.encode_cell({ r, c })]; if (cell && XF[f]) cell.z = XF[f]; });
  ws['!cols'] = head.map((h, i) => ({ wch: (widths && widths[i]) || Math.max(11, Math.min(24, h.length + 3)) }));
  ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(1, rows.length), c: head.length - 1 } }) };

}
/* several titled tables stacked on one sheet */
function blocksSheet(X, blocks, widths) {

    if (b.head) { aoa.push(b.head); z.push([]); }

async function downloadXlsx() {
  const msg = document.getElementById('xlsxMsg'); const btn = document.getElementById('xlsx');
  if (!rangeDays().some(d => S.days[d] && S.days[d].shop)) { msg.textContent = 'No data in this range yet.'; return; }
  btn.disabled = true; msg.textContent = 'Building workbook…';
  try {
    const X = await loadXlsx();
    const buf = X.write(buildWorkbook(X), { bookType: 'xlsx', type: 'array', cellDates: true });
    const name = `Big-Festive-Days_${S.from}_to_${clampToday(S.to)}.xlsx`;
    msg.textContent = '';
    await S.downloads.save({ filename: name, data: new Blob([buf]) });
    msg.textContent = 'Saved.';
  } catch (e) {
    const code = e && e.code;
    msg.textContent = code === 'declined' ? 'Download cancelled.' :
      code === 'rate_limited' ? 'A download prompt is already open. Finish it, then try again.' :
      code === 'extension_not_enabled' || code === 'rejected_extension' ? 'Excel downloads are not available in this view.' :
      e && e.message === 'lib' ? 'Could not load the Excel builder. Check your connection and try again.' :
      'Download failed. Try again.';
  } finally { btn.disabled = false; }
}

  if (e.target.id === 'skuQ') { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { S.skuQ = v; renderAll(); const el = document.getElementById('skuQ'); if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } }, 250); }
});
const catSel = document.getElementById('catSel');
catSel.insertAdjacentHTML('beforeend', CATS.filter(c => c !== 'Unmapped').map(c => `<option>${esc(c)}</option>`).join(''));
catSel.addEventListener('change', e => { S.cat = e.target.value; renderAll(); });
main.addEventListener('change', e => {
  if (e.target.id === 'cmpDate' && e.target.value) {
    S.anchor = e.target.value >= today ? null : e.target.value;   // null = follow D0 (today)
    renderAll(); dbLoadSkus().catch(() => {}).then(() => { renderAll(); refresh(false); });
  }
  if (e.target.id === 'ga4file' && e.target.files[0]) importGa4(e.target.files[0]);
});
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (S.tab === 'day' || S.tab === 'sum') renderAll(); }, 200); });

/* ---------- boot ---------- */
renderAll();
(async () => {
  const has = window.claude && typeof window.claude.use === 'function';
  const [db, mcp, user, downloads] = has ? await Promise.all([
    window.claude.use('db').catch(() => null), window.claude.use('mcp').catch(() => null), window.claude.use('user').catch(() => null),
    window.claude.use('downloads').catch(() => null),
  ]) : [null, null, null, null];
  S.db = db; S.mcp = mcp; S.downloads = downloads;
  document.getElementById('xlsx').hidden = !downloads;
  if (user && typeof user.can === 'function') { try { const c = await user.can('data.write'); if (c === false) S.canWrite = false; } catch (e) {} }
  if (!db) S.status.db = { st: 'idle', msg: 'Not available in this view' };
  await dbLoad();
  followLive();
  if (!mcp) {
    const msg = 'Live data is not available in this view.';
    S.status[SHOP] = { st: 'idle', msg: msg }; S.status[LR] = { st: 'idle', msg: msg };
    renderAll(); return;
  }
  renderAll();
  refresh(false);
  // hourly refresh of today's numbers and the projection; reload after midnight IST so "today" moves on
  let lastTick = Date.now();
  const tick = () => {
    if (nowIST().toISOString().slice(0, 10) !== today) { location.reload(); return; }
    lastTick = Date.now(); dbLoadReturns().then(() => { if (S.tab === 'ret') renderAll(); }); refresh(false);
  };
  setInterval(tick, 60 * 60 * 1000);
  setInterval(liveTick, LIVE_MS);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) return;
    if (Date.now() - lastTick > 60 * 60 * 1000) tick();
    else if (Date.now() - (S.lastLive || S.lastRefresh || 0) > LIVE_MS) liveTick();
  });
})();
})();
</script>
